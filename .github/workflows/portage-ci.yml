name: portage-ci

# Lane B. Non-interactive CI. The deterministic gate spends no model tokens at
# all; the reviewer job runs off the interactive session entirely.

on:
  pull_request:
    branches: [main]

jobs:
  # ---- The milestone gate: deterministic, no model, must pass. ----
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run test suite (Milestone gate)
        run: uv run pytest -q
      - name: Re-render check (HB-0) — registry/settings must match the committed example
        run: >
          uv run --extra config python src/portage/render_config.py
          --registry config/profiles/scale1.example.registry.yaml
          --settings config/profiles/scale1.example.settings.yaml
          --schema schema/registry.schema.json
          --out-dir config/profiles
          --config-name scale1.example.yaml
          --model-list-name scale1.example.model_list.yaml
          --check

  # ---- Automated review: only runs if the gate is green. ----
  review:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
      - name: Review diff against milestone criteria
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DIFF=$(git diff origin/main...HEAD)
          # Phase 1 found Claude Code talks to the Anthropic API directly with no
          # gateway needed for a single-shot call (docs/phase-1-findings.md), so
          # claude-code-router is gone. Milestone-gate criteria are pinned to the
          # frontier model and never downshifted — explicit --model, not a
          # heuristic, is what makes that a guarantee rather than a hope.
          claude --bare -p "You are reviewing a PR against the taskcapture milestone \
          criteria (extraction correctness, routing to Todoist, no regressions in \
          the milestone-gated approval flow). Report blocking issues only, concise. \
          Diff:\n${DIFF}" --model claude-opus-4-8 --tools "" --no-session-persistence \
          | tee review.md
      - name: Post review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Automated review (Lane B / CCR)\n\n${body}`
            });
