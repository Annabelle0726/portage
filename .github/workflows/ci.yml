name: CI

on:
  push:
    branches: [ main, master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    # 如果后端测试依赖 PostgreSQL/Redis 等服务，可在 services 中开启，不需要可直接删除
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: portage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 根据 Portage 使用的 Python 版本调整（如 3.10 / 3.12）
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff

      - name: Run Ruff (Linter & Formatter Check)
        run: |
          ruff check .

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/portage_test
          TESTING: 'true'
        run: |
          pytest --cov=. --cov-report=xml

  frontend-tests:
    name: Frontend Build & Check
    runs-on: ubuntu-latest
    # 如果当前项目仅有后端，可注释或删除整个 frontend-tests 任务
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # 如果使用 pnpm 或 yarn，请更改为相应的包管理器

      - name: Install Frontend Dependencies
        run: |
          if [ -d "frontend" ]; then cd frontend && npm ci; elif [ -f "package.json" ]; then npm ci; fi

      - name: Run Type Check & Build
        run: |
          if [ -f "package.json" ]; then
            npm run build --if-present
          elif [ -d "frontend" ]; then
            cd frontend && npm run build --if-present
          fi