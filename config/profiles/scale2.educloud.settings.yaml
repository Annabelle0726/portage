#
# scale2.educloud.settings.yaml — router/litellm/general settings shared by both
# EduCloud lanes. Rendered verbatim into scale2.educloud.student.yaml and
# scale2.educloud.staff.yaml alongside each one's `include:` line.
#
# One settings file, two registries. The lanes differ ONLY in which deployments
# exist, which is exactly what the expansion contract requires: the Scale-2 step
# is a diff in `model_list` and `router_settings`, nothing else. If a future
# change needs the two lanes to differ in general_settings, that is the signal
# that the config/registry separation has broken down — fix the separation,
# don't fork this file.
#
# Diff against scale1.example.settings.yaml, in full:
#   allowed_fails  1  -> 3     Jetstream2 is a shared HPC resource. A queued or
#                              briefly saturated endpoint is normal operation,
#                              not a sick deployment, and ejecting it after one
#                              timeout would strand the sovereign default and
#                              push work to the hosted tail — which on the
#                              student lane does not exist, so the request
#                              simply fails. Tolerance here is a privacy
#                              property, not just an availability one.
#   cooldown_time  300 -> 120  Shorter, for the same reason inverted: when a
#                              queue drains, the sovereign deployment should
#                              rejoin promptly rather than sit out five minutes.
#
# Both numbers are provisional. TODO(allocation): re-tune against observed JS2
# queue behaviour during the E1 pilot semester, and record the measured values
# in the deployment's KNOWN_GOOD_VERSIONS.md. Guessing them now is fine;
# leaving them unexamined after real traffic is not.

router_settings:
  routing_strategy: simple-shuffle   # `order` governs; shuffle only breaks ties
  num_retries: 2
  allowed_fails: 3                   # see header — HPC queueing is not illness
  cooldown_time: 120
  enable_pre_call_checks: true

litellm_settings:
  drop_params: true                  # tolerate provider param mismatches

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true     # VERIFIED (KNOWN_GOOD_VERSIONS.md): these
  health_check_interval: 300         # live under general_settings, NOT
  database_url: os.environ/DATABASE_URL   # router_settings, on v1.93.x
