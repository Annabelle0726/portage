# LiteLLM proxy — SENSITIVE / SOVEREIGN mode.
#
# The data-classification pin, enforced structurally: this file contains ONLY
# local deployments. Commercial and shared-HPC endpoints are physically absent,
# so a misroute to them is impossible — the pin is not a runtime check that
# could be bypassed, prompted around, or mis-inferred by a model.
#
# Use for any workspace touching clinical, student-record, or otherwise
# regulated data. Note the distinction that governs this file: institutional
# HPC is SOVEREIGN but NOT PRIVATE (shared infrastructure, admin-visible,
# research-use-only), so it does not appear here either.
#
# If a local model cannot complete a task under this config, the correct
# outcome is that it STOPS and escalates to a human — never that it reaches
# for a bigger model somewhere else.
#
#   litellm --config litellm.sensitive.yaml --port 4000

model_list:
  - model_name: work
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://localhost:11434
    model_info: {tier: local, cost_class: free}

  - model_name: judgment
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://localhost:11434
    model_info: {tier: local, cost_class: free}

  - model_name: steward
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434
    model_info: {tier: local, cost_class: free}

router_settings:
  num_retries: 2
  cooldown_time: 60
  fallbacks: []          # nowhere to fall back TO. That is the point.

litellm_settings:
  drop_params: true
  # No external callbacks: trace data from sensitive work stays local too.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
