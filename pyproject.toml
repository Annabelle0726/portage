[project]
name = "commons-control-plane"
version = "0.1.0"
description = "Quota- and sovereignty-aware agent control plane: verifier-driven routing across local, sovereign, and subscription meters."
requires-python = ">=3.11"
dependencies = []          # stdlib only by design; see HANDOFF.md
license = {text = "Apache-2.0"}

[project.optional-dependencies]
# Installed only where actually needed, so the core stays dependency-free.
proxy = ["litellm[proxy]"]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Phase 2 acceptance: the suite must pass with NO network and NO model calls.
addopts = "-q"
